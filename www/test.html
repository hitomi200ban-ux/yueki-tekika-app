<!DOCTYPE html>
<html>
<head><meta charset="UTF-8"><title>test</title></head>
<body>
<h1 style="color:red">テスト画面</h1>
<p id="msg">初期値</p>
<div id="box" style="width:200px;height:200px;background:#eee;border:2px solid #0288d1;display:flex;align-items:center;justify-content:center;font-size:24px;font-weight:bold;">
  上下にドラッグ
</div>
<script>
const box = document.getElementById('box');
const msg = document.getElementById('msg');
let startY = 0;
box.addEventListener('touchstart', (e) => {
  startY = e.touches[0].clientY;
  msg.textContent = 'touchstart: ' + startY;
}, { passive: true });
box.addEventListener('touchmove', (e) => {
  e.preventDefault();
  const dy = e.touches[0].clientY - startY;
  msg.textContent = 'touchmove dy: ' + Math.round(dy);
}, { passive: false });
box.addEventListener('touchend', (e) => {
  msg.textContent = 'touchend 完了';
});
</script>
</body>
</html>
