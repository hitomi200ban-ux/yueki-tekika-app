<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>輸液滴下計算 | 看護師・看護学生向け点滴滴下計算アプリ</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- 入力画面 -->
        <div id="inputScreen" class="screen active">
            <div class="app-title-wrap">
                <h1 class="app-title">輸液滴下計算</h1>
                <p class="app-subtitle">看護師・看護学生向け点滴滴下計算アプリ</p>
            </div>

            <div class="form-group">
                <div class="label-hint-row">
                    <label>輸液量</label>
                    <p class="swipe-hint">左右にスワイプ・タップで選択</p>
                </div>
                <div class="volume-swiper-wrapper">
                    <button class="swiper-arrow left" id="prevBtn">&#8249;</button>
                    <div class="volume-swiper">
                        <div class="swiper-track" id="swiperTrack">
                            <div class="swiper-item" data-volume="1500"><img src="./img/1500ml.PNG" alt="1500ml"></div>
                            <div class="swiper-item" data-volume="500"><img src="./img/500ml.PNG" alt="500ml"></div>
                            <div class="swiper-item" data-volume="200"><img src="./img/200ml.PNG" alt="200ml"></div>
                            <div class="swiper-item" data-volume="100"><img src="./img/100ml.PNG" alt="100ml"></div>
                            <div class="swiper-item" data-volume="50"><img src="./img/50ml.PNG" alt="50ml"></div>
                            <div class="swiper-item" data-volume="manual">
                                <div class="manual-input-box">
                                    <p class="manual-label">手動で入力</p>
                                    <input type="number" id="manualVolume" placeholder="例：250" min="1" step="1">
                                    <button id="manualConfirmBtn" class="manual-confirm-btn">決定</button>
                                </div>
                            </div>
                        </div>
                    </div>
                    <button class="swiper-arrow right" id="nextBtn">&#8250;</button>
                </div>
                <p class="selected-volume-label"><span id="selectedVolumeText">未選択</span></p>
            </div>

            <div class="form-group">
                <label>輸液ルートの種類</label>
                <div class="button-group">
                    <button id="adultBtn" class="type-btn" data-type="adult">
                        <img src="./img/seizinyou.PNG" alt="成人用">
                        <span>成人用（20滴/mL）</span>
                    </button>
                    <button id="childBtn" class="type-btn" data-type="child">
                        <img src="./img/sixyouniyou.PNG" alt="小児用">
                        <span>小児用（60滴/mL）</span>
                    </button>
                </div>
            </div>

            <div class="form-group">
                <div class="label-hint-row">
                    <label>投与時間</label>
                    <p class="swipe-hint">数字をタップして選択</p>
                </div>
                <div class="time-card">
                    <div class="time-spinner-wrap">
                        <button class="time-arrow-btn" id="hourUp">▲</button>
                        <select id="hourSelect" class="time-select">
                            <option value="0">0</option><option value="1">1</option><option value="2">2</option>
                            <option value="3">3</option><option value="4">4</option><option value="5">5</option>
                            <option value="6">6</option><option value="7">7</option><option value="8" selected>8</option>
                            <option value="9">9</option><option value="10">10</option><option value="11">11</option>
                            <option value="12">12</option><option value="13">13</option><option value="14">14</option>
                            <option value="15">15</option><option value="16">16</option><option value="17">17</option>
                            <option value="18">18</option><option value="19">19</option><option value="20">20</option>
                            <option value="21">21</option><option value="22">22</option><option value="23">23</option>
                            <option value="24">24</option>
                        </select>
                        <button class="time-arrow-btn" id="hourDown">▼</button>
                    </div>
                    <span class="time-label">時間</span>
                    <div class="time-spinner-wrap">
                        <button class="time-arrow-btn" id="minuteUp">▲</button>
                        <select id="minuteSelect" class="time-select">
                            <option value="0" selected>00</option>
                            <option value="15">15</option>
                            <option value="30">30</option>
                            <option value="45">45</option>
                        </select>
                        <button class="time-arrow-btn" id="minuteDown">▼</button>
                    </div>
                    <span class="time-label">分</span>
                </div>
            </div>

            <p class="summary-title">計算式</p>
            <div class="confirm-summary" id="confirmSummary">
                <span class="summary-value" id="summaryVolume">--</span><span class="summary-unit"> mL</span> <span class="summary-operator">×</span> <span class="summary-value" id="summaryDrop">--</span><span class="summary-unit">滴/mL</span>
                <div class="summary-divider"></div>
                <span class="summary-value" id="summaryHour">--</span><span class="summary-unit">時間</span><span class="summary-value" id="summaryMin">--</span><span class="summary-unit">分（</span><span class="summary-value" id="summaryTotalMin">--</span><span class="summary-unit">分）</span>
            </div>

            <button id="calculateBtn" class="calculate-btn">計算する</button>
        </div>

        <!-- 結果画面 -->
        <div id="resultScreen" class="screen result-screen-layout">

            <div class="result-title">輸液滴下計算</div>
            <div class="result-subtitle">看護師・看護学生向け点滴滴下計算アプリ</div>

            <!-- チャンバー中央・数値を四隅に配置 -->
            <div class="result-card">
                <!-- 左上：滴下速度 -->
                <div class="rn-topleft">
                    <div class="rn-label">滴下速度</div>
                    <div class="rn-rate-wrap">
                        <span class="rn-rate" id="dropRate">--</span>
                    </div>
                    <div class="rn-unit">滴/分</div>
                    <div class="rn-exact">(<span id="dropRateExact">--</span>)</div>
                </div>

                <!-- 右上：音ボタン -->
                <button id="soundBtn" class="sound-btn-v sound-btn-corner" data-on="false">
                    <span class="sound-icon">🔇</span>
                    <span class="sound-label-v">音OFF</span>
                </button>

                <!-- 中央：アニメーション -->
                <div class="result-center">
                    <div class="chamber-wrap" id="chamberAdult">
                        <img src="./img/seizinyou_tekika.PNG" id="chamberImg" class="chamber-img">
                        <canvas id="dropCanvas"></canvas>
                    </div>
                    <div class="chamber-wrap" id="chamberChild" style="display:none;">
                        <img src="./img/sixyouni_tekika.PNG" id="chamberImgChild" class="chamber-img">
                        <canvas id="dropCanvasChild"></canvas>
                    </div>
                </div>

                <!-- 右下：計算式ボタン -->
                <button class="formula-toggle-v" id="formulaToggle" aria-expanded="false">
                    <span>計算式</span>
                </button>

                <!-- 左下：合わせ方 -->
                <div class="rn-bottomleft">
                    <div class="rn-label">合わせ方</div>
                    <div class="rn-sec-wrap">
                        <span class="rn-sec" id="dropIntervalSec">--</span>
                    </div>
                    <div class="rn-sec-unit">秒に1滴</div>
                </div>
            </div>

            <!-- 計算式パネル（タップで表示） -->
            <div class="formula-body" id="formulaBody">
                <div class="formula-inner">
                    <div class="formula-line">
                        <span class="formula-val" id="fVolume">--</span><span class="formula-unit">mL</span>
                        <span class="formula-op"> × </span>
                        <span class="formula-val" id="fDrop">--</span><span class="formula-unit">滴/mL</span>
                    </div>
                    <div class="formula-divider"></div>
                    <div class="formula-line formula-time">
                        <span class="formula-val" id="fHour">--</span><span class="formula-unit">時間</span>
                        <span class="formula-val" id="fMin">--</span><span class="formula-unit">分</span>
                        <span class="formula-paren">（<span id="fTotalMin">--</span>分）</span>
                    </div>
                    <div class="formula-result-line">
                        <span class="formula-eq">= </span><span class="formula-exact" id="fExact">--</span><span class="formula-unit"> 滴/分</span>
                    </div>
                    <div class="formula-result-line">
                        <span class="formula-eq">≈ </span><span class="formula-approx" id="fApprox">--</span><span class="formula-unit"> 滴/分</span>
                    </div>
                </div>
            </div>

            <!-- 旧IDを維持（アニメーション用） -->
            <span id="dropInterval" style="display:none;"></span>

            <button id="backBtn" class="back-btn">戻る</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
